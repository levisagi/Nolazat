let AC;
function initAC(){ if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)(); }
function tone(f,t,d,v=0.3,dt=0){
  if(!AC)return;
  const now=AC.currentTime+dt;
  const o=AC.createOscillator(), g=AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type=t; o.frequency.value=f;
  g.gain.setValueAtTime(v,now);
  g.gain.exponentialRampToValueAtTime(0.001,now+d);
  o.start(now); o.stop(now+d);
}
const sfxJump=()=>{ tone(180,'square',0.08,0.25); tone(340,'square',0.12,0.2,0.05); };
const sfxShoot=()=>{ tone(900,'sine',0.07,0.18); tone(1400,'sine',0.06,0.12,0.04); };
const sfxHit=()=>{ tone(120,'sawtooth',0.25,0.45); tone(70,'sawtooth',0.3,0.35,0.1); };
const sfxCollect=()=>{ [600,800,1000,1300].forEach((f,i)=>tone(f,'sine',0.1,0.3,i*0.06)); };
const sfxDie=()=>{ [380,290,200,130].forEach((f,i)=>tone(f,'square',0.08,0.3,i*0.06)); };
const sfxGO=()=>{ [350,280,220,180,140].forEach((f,i)=>tone(f,'square',0.22,0.45,i*0.18)); };
const sfxWin=()=>{ [330,440,550,660,880,1100].forEach((f,i)=>tone(f,'square',0.18,0.45,i*0.1)); };
const sfxBoss=()=>{ [80,100,130,80,60].forEach((f,i)=>tone(f,'sawtooth',0.35,0.55,i*0.22)); };

let bgOscs=[];
function startBG(){
  stopBG(); if(!AC) return;
  const seq=[196,220,262,220,196,165,196,220];
  let t=AC.currentTime+0.1;
  const loop=()=>{
    seq.forEach((n,i)=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.connect(g);g.connect(AC.destination);
      o.type='square'; o.frequency.value=n;
      g.gain.setValueAtTime(0.04,t+i*0.22);
      g.gain.exponentialRampToValueAtTime(0.001,t+i*0.22+0.18);
      o.start(t+i*0.22); o.stop(t+i*0.22+0.18);
      bgOscs.push(o);
    });
    t+=seq.length*0.22;
    if(t<AC.currentTime+30) loop();
  };
  loop();
}
function stopBG(){ bgOscs.forEach(o=>{try{o.stop();}catch(e){}}); bgOscs=[]; }

  if((e.key==='ArrowUp'||e.key===' ')&&!K.j){jp=1;K.j=1;}
  if((e.key==='z'||e.key==='Z'||e.key==='x')&&!K.s){sp=1;K.s=1;}
  if(['menu','gameover','win'].includes(GS)) startGame();
  e.preventDefault();
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft') K.l=0;
  if(e.key==='ArrowRight') K.r=0;
  if(e.key==='ArrowUp'||e.key===' ') K.j=0;
  if(e.key==='z'||e.key==='Z'||e.key==='x') K.s=0;
});

function setupBtn(id,key,shot=false){
  const el=document.getElementById(id);
  if(!el) return;
  const dn=e=>{e.preventDefault();initAC();K[key]=1;if(shot){if(key==='j')jp=1;if(key==='s')sp=1;}
    if(['menu','gameover','win'].includes(GS)) startGame();};
  const up=e=>{e.preventDefault();K[key]=0;};
  el.addEventListener('touchstart',dn,{passive:false});
  el.addEventListener('touchend',up,{passive:false});
  el.addEventListener('mousedown',dn); el.addEventListener('mouseup',up);
}
setupBtn('bL','l'); setupBtn('bR','r'); setupBtn('bJ','j',true); setupBtn('bS','s',true);

// ═══════════════════════════════════════════════════════════════
// DRAWING HELPERS
// ═══════════════════════════════════════════════════════════════
function rr(x,y,w,h,r=4){
  cx.beginPath();
  if(cx.roundRect) cx.roundRect(x,y,w,h,r);
  else cx.rect(x,y,w,h);
  cx.fill();
}

function speech(bx,by,text,side=1){
  if(!text) return;
  const pad=13, maxW=260, lH=20, fontSize=15;
  cx.font='bold '+fontSize+'px Arial';
  const words=text.split(' ');
  const lines=[]; let cur='';
  for(const w of words){
    const t=cur?cur+' '+w:w;
    if(cx.measureText(t).width>maxW-pad*2){if(cur)lines.push(cur);cur=w;}
    else cur=t;
  }
  if(cur)lines.push(cur);
  const bw=Math.min(maxW,Math.max(...lines.map(l=>cx.measureText(l).width))+pad*2+10);
  const bh=lines.length*lH+pad*2+4;
  let sx=bx-bw/2, sy=by-bh-28;
  sx=Math.max(4,Math.min(GW-bw-4,sx)); sy=Math.max(4,sy);
  // Shadow
  cx.fillStyle='rgba(0,0,0,0.18)';
  cx.beginPath(); if(cx.roundRect)cx.roundRect(sx+3,sy+3,bw,bh,10); else cx.rect(sx+3,sy+3,bw,bh); cx.fill();
  // Bubble body
  cx.fillStyle='rgba(255,255,235,0.98)'; cx.strokeStyle='#2244aa'; cx.lineWidth=2.5;
  cx.beginPath(); if(cx.roundRect)cx.roundRect(sx,sy,bw,bh,10); else cx.rect(sx,sy,bw,bh); cx.fill(); cx.stroke();
  // Tail
  cx.fillStyle='rgba(255,255,235,0.98)';
  cx.beginPath(); cx.moveTo(bx-9,sy+bh); cx.lineTo(bx+9,sy+bh); cx.lineTo(bx,sy+bh+22); cx.closePath(); cx.fill();
  cx.strokeStyle='#2244aa'; cx.lineWidth=2;
  cx.beginPath(); cx.moveTo(bx-9,sy+bh); cx.lineTo(bx,sy+bh+22); cx.lineTo(bx+9,sy+bh); cx.stroke();
  // Text
  cx.fillStyle='#111133'; cx.font='bold '+fontSize+'px Arial'; cx.textAlign='center'; cx.direction='rtl';
  lines.forEach((l,i)=>cx.fillText(l,sx+bw/2,sy+pad+fontSize+i*lH));
  cx.direction='ltr'; cx.textAlign='left';
}

// ═══════════════════════════════════════════════════════════════
// SPRITE: PLAYER - BIG HEAD SOLDIER
// ═══════════════════════════════════════════════════════════════
function drawSoldier(ox,fy,dir,state,fr,isEnemy=false){
  const BC=isEnemy?'#354025':'#4d6035';
  const DB=isEnemy?'#28341a':'#3a4d28';
  const SK=isEnemy?'#b07248':'#c8906a';
  const HC=isEnemy?'#1a2810':'#2a3d18';
  const BT='#1a1a10';

  const lOff=state==='run'?Math.sin(fr*0.28)*7:0;

  // Boots
  cx.fillStyle=BT;
  cx.fillRect(ox-11+lOff*dir,fy-17,12,14);
  cx.fillRect(ox+1-lOff*dir,fy-17,12,14);
  // Legs
  cx.fillStyle=DB;
  cx.fillRect(ox-10+lOff*dir,fy-30,10,15);
  cx.fillRect(ox+2-lOff*dir,fy-30,10,15);
  // Torso
  cx.fillStyle=BC;
  cx.fillRect(ox-14,fy-54,28,27);
  cx.fillStyle=DB;
  cx.fillRect(ox-2,fy-54,4,27);
  cx.fillRect(ox-14,fy-48,8,7);
  cx.fillRect(ox+7,fy-48,8,7);
  // Arms
  const aS=state==='run'?Math.cos(fr*0.28)*9:0;
  cx.fillStyle=BC;
  cx.save(); cx.translate(ox-15,fy-52); cx.rotate(aS*0.05*dir);
  cx.fillRect(-8,0,10,22); cx.fillStyle=SK; cx.fillRect(-8,20,10,10); cx.restore();
  cx.fillStyle=BC;
  cx.save(); cx.translate(ox+13,fy-52); cx.rotate(-aS*0.05*dir);
  cx.fillRect(0,0,10,22); cx.fillStyle=SK; cx.fillRect(0,20,10,10); cx.restore();

  // HEAD SIZE: player = BIG (28), enemy = small (15)
  const hR = isEnemy ? 15 : 28;
  const hy  = fy - 62 - hR; // head center Y (sits on torso)

  // Neck
  cx.fillStyle = isEnemy ? SK : '#c8986a';
  cx.fillRect(ox-6, fy-60, 12, 10);

  // HEAD SHAPE
  cx.fillStyle = isEnemy ? SK : '#c8986a';
  cx.beginPath(); cx.arc(ox, hy, hR, 0, Math.PI*2); cx.fill();

  if(!isEnemy){
    // ── FULL HAIR (short dark, covers whole head under cap) ────
    const hairC = '#1e1208', hairC2 = '#2e1a0c', hairC3 = '#3d2414';

    // Full hair base - covers entire head
    cx.fillStyle = hairC;
    cx.beginPath(); cx.arc(ox, hy, hR+1, 0, Math.PI*2); cx.fill();

    // Skin re-draw only on face area (lower half)
    cx.fillStyle = '#c8986a';
    cx.beginPath(); cx.arc(ox, hy, hR, Math.PI*0.05, Math.PI*0.95, false); cx.fill();

    // Hair on sides (visible below cap, above ears)
    cx.fillStyle = hairC;
    cx.beginPath(); cx.ellipse(ox - hR*0.9, hy + hR*0.15, hR*0.22, hR*0.55, -0.08, 0, Math.PI*2); cx.fill();
    cx.beginPath(); cx.ellipse(ox + hR*0.9, hy + hR*0.15, hR*0.22, hR*0.55,  0.08, 0, Math.PI*2); cx.fill();

    // Sideburns
    cx.fillStyle = hairC2;
    cx.beginPath(); cx.ellipse(ox - hR*0.85, hy + hR*0.48, hR*0.14, hR*0.22, 0, 0, Math.PI*2); cx.fill();
    cx.beginPath(); cx.ellipse(ox + hR*0.85, hy + hR*0.48, hR*0.14, hR*0.22, 0, 0, Math.PI*2); cx.fill();

    // Hair texture streaks (wavy)
    cx.fillStyle = hairC3;
    cx.beginPath(); cx.ellipse(ox - hR*0.2, hy - hR*0.82, hR*0.25, hR*0.09, -0.25, 0, Math.PI*2); cx.fill();
    cx.beginPath(); cx.ellipse(ox + hR*0.15, hy - hR*0.85, hR*0.2,  hR*0.08,  0.2,  0, Math.PI*2); cx.fill();
    cx.beginPath(); cx.ellipse(ox - hR*0.55, hy - hR*0.7,  hR*0.18, hR*0.07, -0.4,  0, Math.PI*2); cx.fill();
    cx.beginPath(); cx.ellipse(ox + hR*0.48, hy - hR*0.72, hR*0.18, hR*0.07,  0.4,  0, Math.PI*2); cx.fill();

    // ── BASEBALL CAP (מצחייה) ────────────────────────────────────
    const capC = '#4a6030', capD = '#3a4e24', capB = '#2e3e1c';
    // Cap body (rounded top)
    cx.fillStyle = capC;
    cx.beginPath();
    cx.arc(ox, hy, hR*1.06, Math.PI*1.05, Math.PI*1.95, false);
    cx.lineTo(ox + hR*0.95, hy - hR*0.08);
    cx.arc(ox, hy, hR*0.72, Math.PI*1.95, Math.PI*1.05, true);
    cx.closePath(); cx.fill();
    // Cap band (stripe at bottom of cap)
    cx.fillStyle = capD;
    cx.beginPath();
    cx.arc(ox, hy, hR*1.06, Math.PI*1.78, Math.PI*1.22, true);
    cx.arc(ox, hy, hR*0.88, Math.PI*1.22, Math.PI*1.78, false);
    cx.closePath(); cx.fill();
    // Cap button on top
    cx.fillStyle = capB;
    cx.beginPath(); cx.arc(ox, hy - hR*1.0, hR*0.1, 0, Math.PI*2); cx.fill();
    // Cap seam line
    cx.strokeStyle = capD; cx.lineWidth = 1;
    cx.beginPath(); cx.arc(ox, hy, hR*0.98, Math.PI*1.15, Math.PI*1.85); cx.stroke();
    // BRIM / VISOR (extends in facing direction)
    const brimDir = dir; // 1=right, -1=left
    cx.fillStyle = capC;
    cx.beginPath();
    cx.moveTo(ox + brimDir*hR*0.3, hy - hR*0.08);
    cx.bezierCurveTo(
      ox + brimDir*hR*0.5, hy - hR*0.18,
      ox + brimDir*hR*1.5, hy - hR*0.1,
      ox + brimDir*hR*1.6, hy + hR*0.05
    );
    cx.bezierCurveTo(
      ox + brimDir*hR*1.5, hy + hR*0.18,
      ox + brimDir*hR*0.4, hy + hR*0.12,
      ox + brimDir*hR*0.2, hy + hR*0.05
    );
    cx.closePath(); cx.fill();
    // Brim underside (darker)
    cx.fillStyle = capB;
    cx.beginPath();
    cx.moveTo(ox + brimDir*hR*0.3, hy + hR*0.02);
    cx.bezierCurveTo(
      ox + brimDir*hR*0.5, hy + hR*0.1,
      ox + brimDir*hR*1.5, hy + hR*0.12,
      ox + brimDir*hR*1.6, hy + hR*0.05
    );
    cx.bezierCurveTo(
      ox + brimDir*hR*1.5, hy + hR*0.18,
      ox + brimDir*hR*0.4, hy + hR*0.14,
      ox + brimDir*hR*0.2, hy + hR*0.06
    );
    cx.closePath(); cx.fill();
    // Brim edge line
    cx.strokeStyle = capB; cx.lineWidth = 1.2;
    cx.beginPath();
    cx.moveTo(ox + brimDir*hR*0.3, hy - hR*0.08);
    cx.bezierCurveTo(
      ox + brimDir*hR*0.5, hy - hR*0.18,
      ox + brimDir*hR*1.5, hy - hR*0.1,
      ox + brimDir*hR*1.6, hy + hR*0.05
    );
    cx.stroke();

    // ── EYES ────────────────────────────────────────────────────
    const ex1 = ox - hR*0.28, ex2 = ox + hR*0.28, ey = hy + hR*0.08;
    // Whites
    cx.fillStyle = '#f5f0e8';
    cx.beginPath(); cx.ellipse(ex1, ey, hR*0.2, hR*0.13, 0, 0, Math.PI*2); cx.fill();
    cx.beginPath(); cx.ellipse(ex2, ey, hR*0.2, hR*0.13, 0, 0, Math.PI*2); cx.fill();
    // Iris (dark brown)
    cx.fillStyle = '#2e1606';
    cx.beginPath(); cx.arc(ex1, ey, hR*0.12, 0, Math.PI*2); cx.fill();
    cx.beginPath(); cx.arc(ex2, ey, hR*0.12, 0, Math.PI*2); cx.fill();
    // Pupil
    cx.fillStyle = '#080402';
    cx.beginPath(); cx.arc(ex1, ey, hR*0.07, 0, Math.PI*2); cx.fill();
    cx.beginPath(); cx.arc(ex2, ey, hR*0.07, 0, Math.PI*2); cx.fill();
    // Shine
    cx.fillStyle = 'rgba(255,255,255,0.9)';
    cx.beginPath(); cx.arc(ex1 + hR*0.05, ey - hR*0.04, hR*0.04, 0, Math.PI*2); cx.fill();
    cx.beginPath(); cx.arc(ex2 + hR*0.05, ey - hR*0.04, hR*0.04, 0, Math.PI*2); cx.fill();
    // Eyelid line
    cx.strokeStyle = '#1a0a04'; cx.lineWidth = 1.2;
    cx.beginPath(); cx.ellipse(ex1, ey, hR*0.2, hR*0.12, 0, Math.PI, Math.PI*2); cx.stroke();
    cx.beginPath(); cx.ellipse(ex2, ey, hR*0.2, hR*0.12, 0, Math.PI, Math.PI*2); cx.stroke();

    // ── EYEBROWS (thick, dark, slightly arched) ─────────────────
    cx.fillStyle = '#150a02';
    cx.beginPath(); cx.ellipse(ex1, ey - hR*0.22, hR*0.22, hR*0.08, -0.12, 0, Math.PI*2); cx.fill();
    cx.beginPath(); cx.ellipse(ex2, ey - hR*0.22, hR*0.22, hR*0.08,  0.12, 0, Math.PI*2); cx.fill();

    // ── NOSE (subtle) ───────────────────────────────────────────
    cx.fillStyle = 'rgba(150,80,40,0.3)';
    cx.beginPath(); cx.ellipse(ox - hR*0.07, hy + hR*0.3, hR*0.09, hR*0.06, 0.3, 0, Math.PI*2); cx.fill();
    cx.beginPath(); cx.ellipse(ox + hR*0.07, hy + hR*0.3, hR*0.09, hR*0.06,-0.3, 0, Math.PI*2); cx.fill();

    // ── BIG SMILE WITH TEETH ────────────────────────────────────
    const my = hy + hR*0.52;
    // Mouth shadow
    cx.fillStyle = '#4a1010';
    cx.beginPath(); cx.ellipse(ox, my, hR*0.38, hR*0.2, 0, 0, Math.PI); cx.fill();
    // Teeth
    cx.fillStyle = '#f4f2ea';
    cx.beginPath(); cx.ellipse(ox, my - hR*0.02, hR*0.33, hR*0.14, 0, 0, Math.PI); cx.fill();
    // Tooth dividers
    cx.strokeStyle = '#ddd5c0'; cx.lineWidth = 0.9;
    [-hR*0.12, 0, hR*0.12].forEach(tx => {
      cx.beginPath(); cx.moveTo(ox+tx, my - hR*0.14); cx.lineTo(ox+tx, my + hR*0.01); cx.stroke();
    });
    // Smile dimples / cheek lines
    cx.strokeStyle = 'rgba(170,80,50,0.45)'; cx.lineWidth = 1.8;
    cx.beginPath(); cx.arc(ox - hR*0.52, my - hR*0.05, hR*0.18, Math.PI*1.3, Math.PI*1.85); cx.stroke();
    cx.beginPath(); cx.arc(ox + hR*0.52, my - hR*0.05, hR*0.18, Math.PI*1.15, Math.PI*1.7); cx.stroke();

    // ── STUBBLE & BEARD (dark, short) ───────────────────────────
    cx.fillStyle = 'rgba(22,10,3,0.5)';
    // Chin
    cx.beginPath(); cx.ellipse(ox, hy + hR*0.75, hR*0.32, hR*0.2, 0, 0, Math.PI*2); cx.fill();
    // Jaw sides
    cx.beginPath(); cx.ellipse(ox - hR*0.42, hy + hR*0.5, hR*0.14, hR*0.28, 0.25, 0, Math.PI*2); cx.fill();
    cx.beginPath(); cx.ellipse(ox + hR*0.42, hy + hR*0.5, hR*0.14, hR*0.28,-0.25, 0, Math.PI*2); cx.fill();
    // Moustache area
    cx.fillStyle = 'rgba(20,8,2,0.35)';
    cx.beginPath(); cx.ellipse(ox, my - hR*0.16, hR*0.26, hR*0.09, 0, 0, Math.PI*2); cx.fill();
    // Dot texture
    cx.fillStyle = 'rgba(18,8,2,0.55)';
    for(let i=0;i<20;i++){
      cx.fillRect(ox - hR*0.38 + i*hR*0.04, hy + hR*0.6 + Math.sin(i*1.9)*hR*0.12, 1.4, 1.4);
    }

    // Shoulder patch - tiger
    cx.fillStyle='#7a5525'; cx.fillRect(ox+(dir>0?12:-22),fy-54,14,9);
    cx.fillStyle='#e8a060'; cx.fillRect(ox+(dir>0?14:-20),fy-52,10,5);

  } else {
    // ── ENEMY FACE (small, angry) ────────────────────────────────
    cx.fillStyle='#cc2200';
    cx.beginPath(); cx.arc(ox-5,hy+2,2.5,0,Math.PI*2); cx.fill();
    cx.beginPath(); cx.arc(ox+5,hy+2,2.5,0,Math.PI*2); cx.fill();
    cx.strokeStyle='#661100'; cx.lineWidth=2;
    cx.beginPath(); cx.arc(ox,hy+9,5,Math.PI+0.3,Math.PI*2-0.3); cx.stroke();
    cx.fillStyle='#1a1810';
    cx.save(); cx.translate(ox-7,hy-4); cx.rotate(0.35); cx.fillRect(0,0,14,2.5); cx.restore();
    cx.save(); cx.translate(ox+7,hy-4); cx.rotate(-0.35); cx.fillRect(-12,0,14,2.5); cx.restore();

    // Enemy helmet
    cx.fillStyle=HC;
    cx.beginPath(); cx.arc(ox,hy,hR+3,Math.PI,Math.PI*2); cx.fill();
    cx.fillRect(ox-(hR+4),hy,(hR+4)*2,8);
  }
}

// BACKGROUND
// ═══════════════════════════════════════════════════════════════
function drawBG(){
  // Sky
  const sky=cx.createLinearGradient(0,0,0,GND);
  sky.addColorStop(0,'#0e1a0e'); sky.addColorStop(1,'#1e301e');
  cx.fillStyle=sky; cx.fillRect(0,0,GW,GND);
  // Stars
  cx.fillStyle='#ccc';
  for(let i=0;i<40;i++){const sx=(i*137.5)%GW,sy=(i*61.3)%(GND*0.6);cx.fillRect(sx,sy,i%3===0?2:1,i%3===0?2:1);}
  // Moon
  cx.fillStyle='#e8e8b8'; cx.beginPath(); cx.arc(410,55,28,0,Math.PI*2); cx.fill();
  cx.fillStyle='#1e301e'; cx.beginPath(); cx.arc(424,49,26,0,Math.PI*2); cx.fill();
  // Hills
  cx.fillStyle='#142014';
  cx.beginPath(); cx.moveTo(0,GND-60);
  cx.bezierCurveTo(120,GND-200,240,GND-140,360,GND-190);
  cx.bezierCurveTo(420,GND-210,460,GND-110,GW,GND-80);
  cx.lineTo(GW,GND); cx.lineTo(0,GND); cx.fill();
  // Fence
  cx.strokeStyle='#4a5a3a'; cx.lineWidth=3;
  for(let i=0;i<GW;i+=28){
    cx.beginPath(); cx.moveTo(i,GND-45); cx.lineTo(i,GND-5); cx.stroke();
    if(i>0){
      cx.lineWidth=1.5; cx.strokeStyle='#5a6a4a';
      cx.beginPath(); cx.moveTo(i-28,GND-38); cx.lineTo(i,GND-38); cx.stroke();
      cx.beginPath(); cx.moveTo(i-28,GND-25); cx.lineTo(i,GND-25); cx.stroke();
      cx.lineWidth=3; cx.strokeStyle='#4a5a3a';
    }
  }
  // Tent
  cx.fillStyle='#3d5028'; cx.beginPath();
  cx.moveTo(10,GND-5); cx.lineTo(75,GND-75); cx.lineTo(140,GND-5); cx.fill();
  cx.fillStyle='#2d3d18'; cx.fillRect(50,GND-42,35,37);
  // Sandbags
  for(let i=0;i<6;i++){cx.fillStyle=`hsl(38,35%,${40+i%2*8}%)`;cx.beginPath();cx.ellipse(290+i*21,GND-12,11,9,0,0,Math.PI*2);cx.fill();}
  // Jeep outline
  cx.fillStyle='#3d5028'; cx.fillRect(345,GND-52,88,42);
  cx.fillStyle='#2d3d18'; cx.fillRect(358,GND-68,55,22);
  cx.fillStyle='#111'; cx.beginPath(); cx.arc(368,GND-12,11,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.arc(412,GND-12,11,0,Math.PI*2); cx.fill();
  cx.fillStyle='#6a7a4a'; cx.fillRect(375,GND-62,25,5);
  // Spotlight
  const ang=(FC*0.008)%(Math.PI*0.7)-Math.PI*0.35;
  cx.save(); cx.globalAlpha=0.07; cx.fillStyle='#ffffaa';
  cx.beginPath(); cx.moveTo(GW-15,GND-105);
  cx.lineTo(GW-15+Math.cos(ang-0.15)*500,GND-105+Math.sin(ang-0.15)*500);
  cx.lineTo(GW-15+Math.cos(ang+0.15)*500,GND-105+Math.sin(ang+0.15)*500);
  cx.closePath(); cx.fill(); cx.restore();
  cx.fillStyle='#5a6a4a'; cx.fillRect(GW-32,GND-118,30,20);
  // Watchtower
  cx.fillStyle='#3d5028'; cx.fillRect(185,GND-140,30,140);
  cx.fillStyle='#2d3d18'; cx.fillRect(175,GND-158,50,22);
  cx.fillStyle='#ffee88'; cx.fillRect(198,GND-152,8,8);
  // Ground
  const g=cx.createLinearGradient(0,GND,0,GH);
  g.addColorStop(0,'#4a3c20'); g.addColorStop(1,'#2a1c08');
  cx.fillStyle=g; cx.fillRect(0,GND,GW,GH-GND);
  for(let i=0;i<GW;i+=38){cx.fillStyle='#382e14';cx.fillRect(i,GND+4,18,3);}
  // Platforms
  PLATS.slice(1).forEach(p=>{
    cx.fillStyle='#4a5a30'; cx.fillRect(p.x,p.y,p.w,p.h);
    cx.fillStyle='#3a4a22'; cx.fillRect(p.x+2,p.y+2,p.w-4,5);
    cx.strokeStyle='#2a3a18'; cx.lineWidth=1; cx.strokeRect(p.x+0.5,p.y+0.5,p.w-1,p.h-1);
    // Crate markings
    if(p.w>80){cx.strokeStyle='#5a6a38';cx.beginPath();cx.moveTo(p.x+p.w/2,p.y);cx.lineTo(p.x+p.w/2,p.y+p.h);cx.stroke();}
  });
}

function drawDayBG(){

  const sky=cx.createLinearGradient(0,0,0,GND);
  sky.addColorStop(0,'#5ab4e8'); sky.addColorStop(0.6,'#8ed4f5'); sky.addColorStop(1,'#c8eeff');

  cx.fillStyle='#ffe030';
  cx.beginPath(); cx.arc(60,55,32,0,Math.PI*2); cx.fill();
  cx.restore();
  cx.fillStyle='rgba(255,230,80,0.25)';
  cx.beginPath(); cx.arc(60,55,52,0,Math.PI*2); cx.fill();
  // Clouds
  [[130,60,1.1],[300,40,0.9],[420,75,1.0]].forEach(([cx2,cy2,s])=>{
    cx.fillStyle='rgba(255,255,255,0.92)';
    cx.beginPath(); cx.arc(cx2,cy2,28*s,0,Math.PI*2); cx.fill();

// PHYSICS
// ═══════════════════════════════════════════════════════════════
function phys(o,isPlayer=false){
  o.vy+=0.52; o.x+=o.vx; o.y+=o.vy; o.onG=0;
  PLATS.forEach(p=>{
    if(o.x+o.w>p.x&&o.x<p.x+p.w&&o.y+o.h>p.y&&o.y+o.h<p.y+o.vy+8&&o.vy>=0){
      o.y=p.y-o.h; o.vy=0; o.onG=1;
    }
  });
  if(isPlayer){ o.x=Math.max(0,Math.min(GW-o.w,o.x)); }
}

function overlap(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }
function cRect(px,py,r,rx,ry,rw,rh){
  const nx=Math.max(rx,Math.min(px,rx+rw)),ny=Math.max(ry,Math.min(py,ry+rh));
  return (px-nx)**2+(py-ny)**2<r*r;
}

function spark(x,y,color,n=8){
  for(let i=0;i<n;i++){
    const a=(Math.PI*2*i/n)+Math.random()*0.6,sp=2+Math.random()*4;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,c:color,sz:3+Math.random()*4,life:30,maxL:30});
  }
}
function updParts(){
  parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.life--;p.sz*=0.94;return p.life>0;});
}
function drawParts(){
  parts.forEach(p=>{cx.save();cx.globalAlpha=p.life/p.maxL;cx.fillStyle=p.c;cx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);cx.restore();});
}

// ═══════════════════════════════════════════════════════════════
// PLAYER UPDATE
// ═══════════════════════════════════════════════════════════════
function updPlayer(){
  const spd=3.8;
  if(K.l){P.vx=-spd;P.face=-1;} else if(K.r){P.vx=spd;P.face=1;} else P.vx*=0.78;
  if(jp&&P.onG){P.vy=-13.5;sfxJump();} jp=0;
  phys(P,true);
  P.state=P.onG?Math.abs(P.vx)>0.5?'run':'idle':'jump';
  P.fr++; if(P.inv>0)P.inv--; if(P.sCD>0)P.sCD--;
  if((K.s||sp)&&P.sCD<=0){
    bullets.push({x:P.x+P.w/2+P.face*22,y:P.y+P.h/2-18,vx:P.face*9,vy:-1.2,r:10,boss:false});
    P.sCD=18; sfxShoot();
  } sp=0;
  if(P.spT>0) P.spT--; else if(Math.random()<0.004){P.spTx=SPEECHES[Math.floor(Math.random()*SPEECHES.length)];P.spT=190;}
  if(P.y>GH+80){P.y=PLATS[0].y-P.h;P.vy=0;dmg();}
}

function dmg(){
  if(P.inv>0) return;
  lives--; P.inv=130; sfxHit(); spark(P.x+P.w/2,P.y+P.h/2,'#ff3333',14);
  if(lives<=0){sfxGO();GS='gameover';stopBG();}
}

// ═══════════════════════════════════════════════════════════════
// ENEMIES
// ═══════════════════════════════════════════════════════════════
function spawnEnemy(){
  const left=Math.random()<0.5;
  const pl=PLATS[Math.floor(Math.random()*PLATS.length)];
  const spd=1.6+diff*0.35;
  enemies.push({x:left?-40:GW+10,y:pl.y-62,w:32,h:62,vx:left?spd:-spd,vy:0,onG:0,hp:Math.ceil(1+diff*0.4),fr:0,die:0,atkT:0});
}
function updEnemies(){
  enemies.forEach(e=>{
    if(e.die>0){e.die--;return;}
    e.fr++;
    const dx=(P.x+P.w/2)-(e.x+e.w/2);
    e.vx=Math.sign(dx)*(1.6+diff*0.35);
    phys(e);
    e.atkT++;
    if(overlap(P,e)&&e.atkT>55){e.atkT=0;dmg();}
    if(Math.abs(e.x)<-300||e.x>GW+300) e.die=1;
  });
  enemies=enemies.filter(e=>e.die>1||e.die===0);
}
function drawEnemies(){
  enemies.forEach(e=>{
    if(e.die>0){
      cx.save(); cx.globalAlpha=e.die/30;
      const cx2=e.x+e.w/2, cy2=e.y+e.h/2;
      cx.translate(cx2,cy2); cx.rotate((30-e.die)*0.12); cx.translate(-cx2,-cy2);
    }
    const dir=e.vx>=0?1:-1;
    drawSoldier(e.x+e.w/2,e.y+e.h,dir,Math.abs(e.vx)>0.3?'run':'idle',e.fr,true);
    if(e.die>0) cx.restore();
  });
}

// ═══════════════════════════════════════════════════════════════
// BULLETS UPDATE
// ═══════════════════════════════════════════════════════════════
function updBullets(){
  bullets=bullets.filter(b=>{
    b.x+=b.vx; b.y+=b.vy;
    if(b.x<-40||b.x>GW+40||b.y<-60||b.y>GH) return false;
    if(!b.boss){
      for(let i=enemies.length-1;i>=0;i--){
        const e=enemies[i]; if(e.die>0) continue;
        if(cRect(b.x,b.y,b.r,e.x,e.y,e.w,e.h)){
          e.hp--; spark(b.x,b.y,'#80d8ff',6);
          if(e.hp<=0){e.die=30;SC+=10;sfxDie();spark(e.x+e.w/2,e.y+e.h/2,'#ffaa00',14);}
          return false;
        }
      }
    }
    return true;
  });
}

// ═══════════════════════════════════════════════════════════════
// COLLECTIBLES
// ═══════════════════════════════════════════════════════════════
function spawnCol(){
  cols.push({x:60+Math.random()*(GW-120),y:80+Math.random()*(GND-200),vy:-0.4,ph:Math.random()*Math.PI*2,done:false});
}
function updCols(){
  cols.forEach(c=>{
    if(c.done) return;
    c.y+=c.vy+Math.sin(FC*0.025+c.ph)*0.6; c.vy*=0.99;
    if(c.y<50) c.vy+=0.2; if(c.y>GND-55) c.vy-=0.2;
    const dist=Math.hypot(c.x-(P.x+P.w/2),c.y-(P.y+P.h/2));
    if(dist<30){
      c.done=true; LZ++; SC+=50; sfxCollect(); spark(c.x,c.y,'#00ff88',12);
      if(LZ>=10){GS='bossIntro';bossIntroT=200;sfxBoss();stopBG();}
    }
  });
  cols=cols.filter(c=>!c.done);
}

// ═══════════════════════════════════════════════════════════════
// BOSS
// ═══════════════════════════════════════════════════════════════
function initBoss(){
  BOSS.x=GW/2-BOSS.w/2; BOSS.y=GND-BOSS.h; BOSS.vx=2.5; BOSS.vy=0;
  BOSS.bullets=[]; BOSS.sCD=80; bossHp=bossMaxHp; plrBossHp=20;
  BOSS.spTx='אוררר אני אחסל אותך!'; BOSS.spT=260;
  setTimeout(()=>{P.spTx='אנההה לא לזעתתתת!!!!';P.spT=220;},1800);
}
function updBoss(){
  BOSS.fr++;
  BOSS.vx=Math.sin(FC*0.022)*(3+diff*0.8);
  if(Math.random()<0.012&&BOSS.onG) BOSS.vy=-13;
  phys(BOSS);
  BOSS.x=Math.max(10,Math.min(GW-BOSS.w-10,BOSS.x));
  BOSS.face=BOSS.vx>=0?1:-1;
  BOSS.sCD--;
  if(BOSS.sCD<=0){
    const dx=(P.x+P.w/2)-(BOSS.x+BOSS.w/2),dy=(P.y+P.h/2)-(BOSS.y+BOSS.h/2);
    const d=Math.hypot(dx,dy),sp=2.8+diff*0.3;
    BOSS.bullets.push({x:BOSS.x+BOSS.w/2,y:BOSS.y+BOSS.h/2-30,vx:(dx/d)*sp,vy:(dy/d)*sp,r:11,boss:true});
    BOSS.sCD=Math.max(55,130-diff*10); sfxShoot();
  }
  BOSS.bullets=BOSS.bullets.filter(b=>{
    b.x+=b.vx; b.y+=b.vy;
    if(b.x<0||b.x>GW||b.y<0||b.y>GH) return false;
    if(P.inv<=0&&cRect(b.x,b.y,b.r,P.x,P.y,P.w,P.h)){
      plrBossHp--; P.inv=90; sfxHit(); spark(P.x+P.w/2,P.y+P.h/2,'#ff4444',10);
      if(plrBossHp<=0){sfxGO();GS='gameover';stopBG();}
      return false;
    }
    return true;
  });
  bullets=bullets.filter(b=>{
    if(b.boss) return true;
    if(cRect(b.x,b.y,b.r,BOSS.x,BOSS.y,BOSS.w,BOSS.h)){
      bossHp--; spark(b.x,b.y,'#ff8800',7);
      if(bossHp<=0){sfxWin();GS='boss2intro';boss2IntroT=200;stopBG();
        for(let i=0;i<5;i++) setTimeout(()=>spark(BOSS.x+BOSS.w/2+Math.random()*60-30,BOSS.y+Math.random()*60,['#ffff00','#ff8800','#ff44ff','#00ffff'][Math.floor(Math.random()*4)],16),i*200);}
      return false;
    }
    return true;
  });
  if(BOSS.spT>0) BOSS.spT--; else if(Math.random()<0.006){BOSS.spTx='אוררר אני אחסל אותך!';BOSS.spT=160;}
}

function initBoss2(){
  BOSS2.x=GW/2-BOSS2.w/2; BOSS2.y=GND-BOSS2.h; BOSS2.vx=2.5; BOSS2.vy=0;
  BOSS2.bullets=[]; BOSS2.sCD=80; boss2Hp=boss2MaxHp; plrBoss2Hp=20;
  BOSS2.spTx=BOSS2_SPEECHES[0]; BOSS2.spT=260;
  setTimeout(()=>{P.spTx='אמיר תפוס קופון!';P.spT=220;},1800);
}
function updBoss2(){
  BOSS2.fr++;
  BOSS2.vx=Math.sin(FC*0.022)*(3+diff*0.8);
  if(Math.random()<0.012&&BOSS2.onG) BOSS2.vy=-13;
  phys(BOSS2);
  BOSS2.x=Math.max(10,Math.min(GW-BOSS2.w-10,BOSS2.x));
  BOSS2.face=BOSS2.vx>=0?1:-1;
  BOSS2.sCD--;
  if(BOSS2.sCD<=0){
    const dx=(P.x+P.w/2)-(BOSS2.x+BOSS2.w/2),dy=(P.y+P.h/2)-(BOSS2.y+BOSS2.h/2);
    const d=Math.hypot(dx,dy),sp=2.8+diff*0.3;
    BOSS2.bullets.push({x:BOSS2.x+BOSS2.w/2,y:BOSS2.y+BOSS2.h/2-30,vx:(dx/d)*sp,vy:(dy/d)*sp,r:14});
    BOSS2.sCD=Math.max(55,130-diff*10); sfxShoot();
  }
  BOSS2.bullets=BOSS2.bullets.filter(b=>{
    b.x+=b.vx; b.y+=b.vy;
    if(b.x<-40||b.x>GW+40||b.y<-60||b.y>GH) return false;
    if(P.inv<=0&&cRect(b.x,b.y,b.r,P.x,P.y,P.w,P.h)){
      plrBoss2Hp--; P.inv=90; sfxHit(); spark(P.x+P.w/2,P.y+P.h/2,'#ff4444',10);
      if(plrBoss2Hp<=0){sfxGO();GS='gameover';stopBG();}
      return false;
    }
    return true;
  });
  bullets=bullets.filter(b=>{
    if(b.boss) return true;
    if(cRect(b.x,b.y,b.r,BOSS2.x,BOSS2.y,BOSS2.w,BOSS2.h)){
      boss2Hp--; spark(b.x,b.y,'#4488ff',7);
      if(boss2Hp<=0){sfxWin();GS='win';stopBG();
        for(let i=0;i<5;i++) setTimeout(()=>spark(BOSS2.x+BOSS2.w/2+Math.random()*60-30,BOSS2.y+Math.random()*60,['#ffff00','#4488ff','#ff44ff','#00ffff'][Math.floor(Math.random()*4)],16),i*200);}
      return false;
    }
    return true;
  });
  if(BOSS2.spT>0) BOSS2.spT--; else if(Math.random()<0.006){BOSS2.spTx=BOSS2_SPEECHES[Math.floor(Math.random()*BOSS2_SPEECHES.length)];BOSS2.spT=160;}
}

// ═══════════════════════════════════════════════════════════════
// DIFFICULTY
// ═══════════════════════════════════════════════════════════════
function updDiff(){
  diff=1+Math.floor(SC/80)*0.12; LV=Math.floor(SC/160)+1;
  const si=Math.max(55,185-LV*18);
  if(++eSpawnT>=si&&enemies.filter(e=>e.die===0).length<5+LV){eSpawnT=0;spawnEnemy();}
  if(++cSpawnT>=280&&cols.length<3){cSpawnT=0;spawnCol();}
}

// ═══════════════════════════════════════════════════════════════
// SCREENS
// ═══════════════════════════════════════════════════════════════
function drawMenu(){
  cx.fillStyle='#0d2010'; cx.fillRect(0,0,GW,GH);
  cx.fillStyle='rgba(255,255,255,0.7)';
  for(let i=0;i<90;i++) cx.fillRect((i*137)%GW,(i*97)%GH,i%5===0?2:1,i%5===0?2:1);
  cx.save(); cx.shadowColor='#00ff55'; cx.shadowBlur=25;
  cx.fillStyle='#00ff55'; cx.font='bold 46px "Courier New"'; cx.textAlign='center';
  cx.fillText('לא לזעת!',GW/2,130);
  cx.restore();
  cx.fillStyle='#aaff44'; cx.font='bold 18px "Courier New"'; cx.textAlign='center';
  cx.fillText('🫧 BUBBLE WARRIOR 🫧',GW/2,162);
  // preview soldier
  cx.save(); cx.translate(GW/2,GH/2+30); drawSoldier(0,60,1,'idle',FC); cx.restore();
  cx.fillStyle='#88cc88'; cx.font='13px Arial'; cx.textAlign='center';
  cx.fillText('← → לזוז  |  ↑ / SPACE לקפוץ  |  Z לירות בועות',GW/2,GH-170);
  cx.fillText('מובייל: כפתורים למטה',GW/2,GH-152);
  if(FC%60<30){cx.fillStyle='#ffffff';cx.font='bold 17px "Courier New"';cx.fillText('לחץ להתחיל!',GW/2,GH-110);}
  cx.textAlign='left';
}

function drawGO(){
  cx.fillStyle='rgba(0,0,0,0.82)'; cx.fillRect(0,0,GW,GH);
  cx.save(); cx.shadowColor='#ff0000'; cx.shadowBlur=35;
  cx.fillStyle='#ff2222'; cx.font='bold 50px "Courier New"'; cx.textAlign='center';
  cx.fillText('GAME OVER',GW/2,GH/2-60); cx.restore();
  cx.fillStyle='#ffaaaa'; cx.font='bold 18px Arial'; cx.textAlign='center';
  cx.fillText('ניקוד: '+SC,GW/2,GH/2); cx.fillText('בועות לא לזעת: '+LZ,GW/2,GH/2+32);
  if(FC%60<30){cx.fillStyle='#fff';cx.font='16px "Courier New"';cx.fillText('לחץ להתחיל מחדש',GW/2,GH/2+80);}
  cx.textAlign='left';
}

function drawWin(){
  cx.fillStyle='rgba(0,15,0,0.88)'; cx.fillRect(0,0,GW,GH);
  if(FC%8===0) for(let i=0;i<3;i++) spark(Math.random()*GW,Math.random()*(GH/2),['#ffff00','#ff8800','#00ffcc','#ff44ff'][Math.floor(Math.random()*4)],3);
  cx.save(); cx.shadowColor='#ffff00'; cx.shadowBlur=35;
  cx.fillStyle='#ffee00'; cx.font='bold 40px "Courier New"'; cx.textAlign='center';
  cx.fillText('🏆 ניצחת! 🏆',GW/2,GH/2-75); cx.restore();
  cx.fillStyle='#00ff88'; cx.font='bold 20px Arial'; cx.textAlign='center';
  cx.fillText('הכית את אנה ואמיר נאמן!',GW/2,GH/2-38);
  cx.fillText('ניקוד: '+SC,GW/2,GH/2);
  cx.fillStyle='#ffff88'; cx.font='bold 15px Arial';
  cx.fillText('יום יבוא ואני אהיה מליונר! 💰',GW/2,GH/2+38);
  if(FC%60<30){cx.fillStyle='#fff';cx.font='15px "Courier New"';cx.fillText('לחץ לשחק שוב',GW/2,GH/2+88);}
  cx.textAlign='left';
}

function drawBossIntro(){
  cx.fillStyle='rgba(0,0,0,0.65)'; cx.fillRect(0,0,GW,GH);
  const prog=Math.min(1,(200-bossIntroT)/60);
  cx.save(); cx.globalAlpha=prog;
  cx.shadowColor='#ff0000'; cx.shadowBlur=50;
  cx.fillStyle='#ff2200'; cx.font='bold 38px "Courier New"'; cx.textAlign='center';
  cx.fillText('⚠ BOSS ⚠',GW/2,GH/2-25);
  cx.fillStyle='#ffaaaa'; cx.font='bold 26px Arial';
  cx.fillText('אנה מגיעה!!!',GW/2,GH/2+22);
  cx.restore(); cx.textAlign='left';
}

// ═══════════════════════════════════════════════════════════════
// GAME INIT
// ═══════════════════════════════════════════════════════════════
function startGame(){
  GS='playing'; SC=0; LZ=0; LV=1; lives=5; diff=1;
  bullets=[]; enemies=[]; cols=[]; parts=[]; BOSS.bullets=[]; BOSS2.bullets=[];
  plrBossHp=20; eSpawnT=0; cSpawnT=0;
  P.x=GW/2-P.w/2; P.y=GND-P.h-5; P.vx=0; P.vy=0;
  P.inv=0; P.sCD=0; P.spT=80; P.spTx='לא לזעתתתתת!!!'; P.face=1;
  spawnCol(); startBG();
}

// ═══════════════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════════════
function loop(){
  try {
    cx.clearRect(0,0,GW,GH); FC++;
    cx.globalAlpha=1; cx.setTransform(1,0,0,1,0,0); cx.direction='ltr'; cx.textAlign='left';

    if(GS==='menu'){
      drawMenu(); updParts(); drawParts();
    } else if(GS==='playing'){
      drawBG(); updDiff(); updPlayer(); updEnemies(); updBullets(); updCols(); updParts();
      cols.forEach(drawCol); bullets.forEach(drawBullet); drawEnemies();
      if(P.inv>0&&P.inv%6<3) cx.globalAlpha=0.3;
      drawSoldier(P.x+P.w/2,P.y+P.h,P.face,P.state,P.fr,false);
      cx.globalAlpha=1;
      if(P.spT>0) speech(P.x+P.w/2,P.y,P.spTx);
      drawParts(); drawHUD();
    } else if(GS==='bossIntro'){
      drawBG();
      if(P.inv>0&&P.inv%6<3) cx.globalAlpha=0.3;
      drawSoldier(P.x+P.w/2,P.y+P.h,P.face,P.state,P.fr,false);
      cx.globalAlpha=1;
      updParts(); drawParts(); drawHUD(); drawBossIntro();
      bossIntroT--;
      if(bossIntroT<=0){GS='boss';initBoss();enemies=[];bullets=[];cols=[];startBG();}
    } else if(GS==='boss'){
      drawBG(); updPlayer(); updBoss(); updBullets(); updParts();
      BOSS.bullets.forEach(drawBullet); bullets.forEach(drawBullet);
      drawBossSprite(BOSS.x+BOSS.w/2,BOSS.y+BOSS.h,BOSS.face);
      if(BOSS.spT>0) speech(BOSS.x+BOSS.w/2,BOSS.y,BOSS.spTx);
      if(P.inv>0&&P.inv%6<3) cx.globalAlpha=0.3;
      drawSoldier(P.x+P.w/2,P.y+P.h,P.face,P.state,P.fr,false);
      cx.globalAlpha=1;
      if(P.spT>0) speech(P.x+P.w/2,P.y,P.spTx);
      drawParts(); drawHUD(); drawBossHUD();
    } else if(GS==='boss2intro'){
      drawDayBG();
      if(P.inv>0&&P.inv%6<3) cx.globalAlpha=0.3;
      drawSoldier(P.x+P.w/2,P.y+P.h,P.face,P.state,P.fr,false);
      cx.globalAlpha=1;
      updParts(); drawParts(); drawHUD(); drawBoss2Intro();
      boss2IntroT--;
      if(boss2IntroT<=0){GS='boss2';initBoss2();enemies=[];bullets=[];cols=[];startBG();}
    } else if(GS==='boss2'){
      drawDayBG(); updPlayer(); updBoss2(); updBullets(); updParts();
      BOSS2.bullets.forEach(drawCoupon); bullets.forEach(drawBullet);
      drawBoss2Sprite(BOSS2.x+BOSS2.w/2,BOSS2.y+BOSS2.h,BOSS2.face);
      if(BOSS2.spT>0) speech(BOSS2.x+BOSS2.w/2,BOSS2.y,BOSS2.spTx);
      if(P.inv>0&&P.inv%6<3) cx.globalAlpha=0.3;
      drawSoldier(P.x+P.w/2,P.y+P.h,P.face,P.state,P.fr,false);
      cx.globalAlpha=1;
      if(P.spT>0) speech(P.x+P.w/2,P.y,P.spTx);
      drawParts(); drawHUD(); drawBoss2HUD();
    } else if(GS==='gameover'){
      drawBG(); updParts(); drawParts(); drawGO();
    } else if(GS==='win'){
      drawDayBG(); updParts(); drawParts(); drawWin();
    }
  } catch(e) {
    cx.fillStyle='#001100'; cx.fillRect(0,0,GW,GH);
    cx.fillStyle='#ff4444'; cx.font='14px monospace'; cx.textAlign='center';
    cx.fillText('Error: '+e.message,GW/2,GH/2);
    cx.fillText('Tap/Click to restart',GW/2,GH/2+30);
    cx.textAlign='left';
  }

  requestAnimationFrame(loop);
}

const loaderEl = document.getElementById('loader');
if(loaderEl) loaderEl.style.display='none';
loop();
</script>
</body>
</html>
