<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>לא לזעת! – Game Box Art A4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a0a;display:flex;flex-direction:column;align-items:center;padding:24px;min-height:100vh;font-family:Arial,sans-serif;}
canvas{display:block;max-width:100%;box-shadow:0 0 60px rgba(0,255,80,0.35),0 20px 80px rgba(0,0,0,0.9);}
.dl{margin-top:18px;padding:14px 36px;background:linear-gradient(135deg,#00cc44,#007722);color:#fff;font:bold 17px monospace;border:none;border-radius:8px;cursor:pointer;letter-spacing:1px;}
.dl:hover{background:linear-gradient(135deg,#00ff55,#00aa33);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button class="dl" onclick="save()">💾 הורד PNG</button>
<script>
const W=794,H=1123;
const cv=document.getElementById('c');
cv.width=W; cv.height=H;
cv.style.width=Math.min(W,window.innerWidth-48)+'px';
const cx=cv.getContext('2d');

function save(){const a=document.createElement('a');a.download='לא-לזעת-boxart-A4.png';a.href=cv.toDataURL('image/png');a.click();}

// ── helpers ──────────────────────────────────────────────────
function rr(x,y,w,h,r=8,fill=true){cx.beginPath();cx.roundRect?cx.roundRect(x,y,w,h,r):cx.rect(x,y,w,h);fill?cx.fill():cx.stroke();}
function star(x,y,r1,r2,pts,col){
  cx.fillStyle=col; cx.beginPath();
  for(let i=0;i<pts*2;i++){const a=i*Math.PI/pts-Math.PI/2,r=i%2===0?r1:r2;
    i===0?cx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r):cx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}
  cx.closePath(); cx.fill();
}
function outline(fn,col='#000',lw=4){cx.save();cx.strokeStyle=col;cx.lineWidth=lw;fn();cx.stroke();cx.restore();}

// ── FLAG ISRAEL ───────────────────────────────────────────────
function flagIsrael(x,y,w,h){
  cx.fillStyle='#fff'; rr(x,y,w,h,2);
  cx.fillStyle='#0038b8';
  cx.fillRect(x,y+h*.14,w,h*.16); cx.fillRect(x,y+h*.7,w,h*.16);
  const sx=x+w/2,sy=y+h/2,sr=h*.19;
  cx.fillStyle='#0038b8'; cx.beginPath();
  for(let i=0;i<6;i++){const a=i/6*Math.PI*2-Math.PI/2,r=i%2===0?sr:sr*.5;
    i===0?cx.moveTo(sx+Math.cos(a)*r,sy+Math.sin(a)*r):cx.lineTo(sx+Math.cos(a)*r,sy+Math.sin(a)*r);}
  cx.closePath(); cx.fill();
  cx.fillStyle='#fff'; cx.beginPath();
  for(let i=0;i<6;i++){const a=i/6*Math.PI*2-Math.PI/2,r=sr*.38;
    i===0?cx.moveTo(sx+Math.cos(a)*r,sy+Math.sin(a)*r):cx.lineTo(sx+Math.cos(a)*r,sy+Math.sin(a)*r);}
  cx.closePath(); cx.fill();
  cx.strokeStyle='#bbb'; cx.lineWidth=1; rr(x,y,w,h,2,false);
}

// ── FLAG 228 ──────────────────────────────────────────────────
function flag228(x,y,w,h){
  cx.fillStyle='#fff'; rr(x,y,w,h,2);
  cx.fillStyle='#006600'; cx.font=`bold ${h*.27}px Arial`; cx.textAlign='center'; cx.direction='rtl';
  cx.fillText('חטיבה 228',x+w/2,y+h*.65);
  cx.direction='ltr'; cx.textAlign='left';
  cx.strokeStyle='#bbb'; cx.lineWidth=1; rr(x,y,w,h,2,false);
}

// ── SOLDIER (protagonist) ─────────────────────────────────────
// ox,oy = center bottom (feet), dir=1 right
function drawSoldier(ox,oy,s=1){
  cx.save(); cx.translate(ox,oy); cx.scale(s,s);
  const BC='#4d6035',DB='#3a4d28',SK='#c8906a',BT='#1a1a10';
  // boots
  cx.fillStyle=BT; cx.fillRect(-13,-16,12,14); cx.fillRect(2,-16,12,14);
  // legs
  cx.fillStyle=DB; cx.fillRect(-12,-30,11,16); cx.fillRect(2,-30,11,16);
  // torso
  cx.fillStyle=BC; cx.fillRect(-15,-56,30,28);
  cx.fillStyle=DB; cx.fillRect(-2,-56,4,28); cx.fillRect(-15,-50,9,8); cx.fillRect(7,-50,9,8);
  // left arm (normal)
  cx.fillStyle=BC; cx.fillRect(-24,-54,10,24); cx.fillStyle=SK; cx.fillRect(-24,-32,10,12);
  // right arm (EXTENDED - shooting pose)
  cx.fillStyle=BC;
  cx.save(); cx.translate(14,-48); cx.rotate(-0.4);
  cx.fillRect(0,0,10,26); cx.fillStyle=SK; cx.fillRect(0,24,10,12); cx.restore();
  // HEAD
  const hR=28,hy=-62-hR;
  // neck
  cx.fillStyle='#c8986a'; cx.fillRect(-6,-60,12,10);
  // full hair base
  cx.fillStyle='#1e1208'; cx.beginPath(); cx.arc(0,hy,hR+1,0,Math.PI*2); cx.fill();
  // skin on face
  cx.fillStyle='#c8986a'; cx.beginPath(); cx.arc(0,hy,hR,Math.PI*.06,Math.PI*.94,false); cx.fill();
  // side hair
  cx.fillStyle='#1e1208';
  cx.beginPath(); cx.ellipse(-hR*.9,hy+hR*.15,hR*.22,hR*.5,-.08,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(hR*.9,hy+hR*.15,hR*.22,hR*.5,.08,0,Math.PI*2); cx.fill();
  // eyes
  cx.fillStyle='#f0ebe0';
  cx.beginPath(); cx.ellipse(-8,hy+2,6,4,0,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(8,hy+2,6,4,0,0,Math.PI*2); cx.fill();
  cx.fillStyle='#2e1606';
  cx.beginPath(); cx.arc(-8,hy+2,3.2,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.arc(8,hy+2,3.2,0,Math.PI*2); cx.fill();
  cx.fillStyle='rgba(255,255,255,.8)';
  cx.beginPath(); cx.arc(-6.5,hy,1.5,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.arc(9.5,hy,1.5,0,Math.PI*2); cx.fill();
  // eyebrows
  cx.fillStyle='#150a02';
  cx.beginPath(); cx.ellipse(-8,hy-7,7,2.5,-.1,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(8,hy-7,7,2.5,.1,0,Math.PI*2); cx.fill();
  // big smile
  cx.fillStyle='#4a1010';
  cx.beginPath(); cx.ellipse(0,hy+14,11,6,0,0,Math.PI); cx.fill();
  cx.fillStyle='#f4f2ea';
  cx.beginPath(); cx.ellipse(0,hy+13,9,4.5,0,0,Math.PI); cx.fill();
  // beard stubble
  cx.fillStyle='rgba(22,10,3,.52)';
  cx.beginPath(); cx.ellipse(0,hy+22,10,6,0,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(-12,hy+15,4.5,8,.2,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(12,hy+15,4.5,8,-.2,0,Math.PI*2); cx.fill();
  // cap
  cx.fillStyle='#4a6030';
  cx.beginPath(); cx.arc(0,hy,hR*1.06,Math.PI*1.05,Math.PI*1.95,false);
  cx.lineTo(hR*.95,hy-2); cx.arc(0,hy,hR*.72,Math.PI*1.95,Math.PI*1.05,true);
  cx.closePath(); cx.fill();
  cx.fillStyle='#3a4e24';
  cx.beginPath();
  cx.arc(0,hy,hR*1.06,Math.PI*1.78,Math.PI*1.22,true);
  cx.arc(0,hy,hR*.88,Math.PI*1.22,Math.PI*1.78,false);
  cx.closePath(); cx.fill();
  // brim right
  cx.fillStyle='#4a6030';
  cx.beginPath(); cx.moveTo(hR*.3,hy-2);
  cx.bezierCurveTo(hR*.5,hy-6,hR*1.5,hy-3,hR*1.6,hy+2);
  cx.bezierCurveTo(hR*1.5,hy+6,hR*.4,hy+4,hR*.2,hy+2);
  cx.closePath(); cx.fill();
  // bubble being shot
  cx.strokeStyle='#55ddff'; cx.lineWidth=3; cx.fillStyle='rgba(80,220,255,.2)';
  cx.beginPath(); cx.arc(55,hy+5,18,0,Math.PI*2); cx.fill(); cx.stroke();
  cx.fillStyle='rgba(255,255,255,.7)';
  cx.beginPath(); cx.arc(48,hy-1,5,0,Math.PI*2); cx.fill();
  cx.fillStyle='#00dd66'; cx.font='bold 7px Arial'; cx.textAlign='center'; cx.direction='rtl';
  cx.fillText('לא',55,hy+3); cx.fillText('לזעת',55,hy+13);
  cx.direction='ltr';
  cx.restore();
}

// ── ANNA BOSS ─────────────────────────────────────────────────
function drawAnna(ox,oy,s=1){
  cx.save(); cx.translate(ox,oy); cx.scale(s,s);
  const SK='#e8c8a8',HR='#6b3a1a',BLK='#111118';
  // legs + shoes
  cx.fillStyle='#1a1010'; cx.fillRect(-20,-50,16,46); cx.fillRect(6,-50,16,46);
  cx.fillStyle='#0a0808'; cx.fillRect(-22,-16,22,16); cx.fillRect(2,-16,22,16);
  // body
  cx.fillStyle=BLK; cx.fillRect(-26,-100,52,54);
  cx.fillStyle='#222230'; cx.beginPath(); cx.moveTo(-10,-100); cx.lineTo(0,-88); cx.lineTo(10,-100); cx.fill();
  // arms - hands on hips (angry pose)
  cx.fillStyle=BLK;
  cx.save(); cx.translate(-32,-92); cx.rotate(.3); cx.fillRect(0,0,14,38); cx.restore();
  cx.save(); cx.translate(20,-92); cx.rotate(-.3); cx.fillRect(0,0,14,38); cx.restore();
  cx.fillStyle=SK;
  cx.save(); cx.translate(-38,-62); cx.rotate(.35); cx.fillRect(0,0,14,16); cx.restore();
  cx.save(); cx.translate(26,-62); cx.rotate(-.35); cx.fillRect(0,0,14,16); cx.restore();
  // necklace
  cx.strokeStyle='#d4af37'; cx.lineWidth=1.5;
  cx.beginPath(); cx.arc(0,-90,12,.2,Math.PI-.2); cx.stroke();
  cx.fillStyle='#d4af37'; cx.beginPath(); cx.arc(0,-78,3,0,Math.PI*2); cx.fill();
  // HEAD (oval)
  cx.fillStyle=SK; cx.beginPath(); cx.ellipse(0,-126,33,35,0,0,Math.PI*2); cx.fill();
  // hair (long, flowing)
  cx.fillStyle=HR;
  cx.beginPath(); cx.moveTo(-30,-155); cx.bezierCurveTo(-50,-130,-54,-88,-46,-48); cx.lineTo(-34,-48); cx.bezierCurveTo(-40,-84,-36,-120,-18,-148); cx.closePath(); cx.fill();
  cx.beginPath(); cx.moveTo(30,-155); cx.bezierCurveTo(50,-130,54,-88,46,-48); cx.lineTo(34,-48); cx.bezierCurveTo(40,-84,36,-120,18,-148); cx.closePath(); cx.fill();
  cx.beginPath(); cx.ellipse(0,-156,30,16,0,0,Math.PI*2); cx.fill();
  // eyes (narrowed/angry)
  cx.fillStyle='#fff';
  cx.beginPath(); cx.ellipse(-12,-128,5,3,0,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(12,-128,5,3,0,0,Math.PI*2); cx.fill();
  cx.fillStyle='#5a3010';
  cx.beginPath(); cx.arc(-12,-128,2.5,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.arc(12,-128,2.5,0,Math.PI*2); cx.fill();
  // angry brows
  cx.fillStyle='#4a2808';
  cx.save(); cx.translate(-14,-136); cx.rotate(.22); cx.beginPath(); cx.ellipse(6,0,9,2.5,0,0,Math.PI*2); cx.fill(); cx.restore();
  cx.save(); cx.translate(14,-136); cx.rotate(-.22); cx.beginPath(); cx.ellipse(-6,0,9,2.5,0,0,Math.PI*2); cx.fill(); cx.restore();
  // pouty lips
  cx.fillStyle='#d07080';
  cx.beginPath(); cx.moveTo(-12,-107); cx.bezierCurveTo(-10,-100,-4,-96,0,-95); cx.bezierCurveTo(4,-96,10,-100,12,-107); cx.bezierCurveTo(6,-106,-6,-106,-12,-107); cx.fill();
  cx.strokeStyle='#a04858'; cx.lineWidth=1;
  cx.beginPath(); cx.moveTo(-12,-107); cx.lineTo(12,-107); cx.stroke();
  // earrings
  cx.fillStyle='#d4af37';
  cx.beginPath(); cx.arc(-33,-124,4,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.arc(33,-124,4,0,Math.PI*2); cx.fill();
  // CROWN
  cx.fillStyle='#d4af37';
  cx.beginPath();
  cx.moveTo(-22,-170); cx.lineTo(-18,-184); cx.lineTo(-8,-176);
  cx.lineTo(0,-190); cx.lineTo(8,-176); cx.lineTo(18,-184); cx.lineTo(22,-170);
  cx.closePath(); cx.fill();
  cx.strokeStyle='#b8860b'; cx.lineWidth=1.5; cx.strokeRect(-22,-170,44,6);
  cx.fillStyle='#ff4444'; cx.beginPath(); cx.arc(0,-188,4.5,0,Math.PI*2); cx.fill();
  cx.fillStyle='#4444ff'; cx.beginPath(); cx.arc(-18,-182,3.5,0,Math.PI*2); cx.fill();
  cx.fillStyle='#44ff44'; cx.beginPath(); cx.arc(18,-182,3.5,0,Math.PI*2); cx.fill();
  cx.restore();
}

// ── AMIR BOSS ─────────────────────────────────────────────────
function drawAmir(ox,oy,s=1){
  cx.save(); cx.translate(ox,oy); cx.scale(s,s);
  const SK='#c8906a',HR='#1a0c06';
  // trousers + shoes
  cx.fillStyle='#1a1a2a'; cx.fillRect(-20,-50,17,46); cx.fillRect(5,-50,17,46);
  cx.fillStyle='#0a0a12'; cx.fillRect(-22,-16,24,16); cx.fillRect(0,-16,24,16);
  // suit jacket
  cx.fillStyle='#1e1e2e'; cx.fillRect(-26,-102,52,56);
  // white shirt
  cx.fillStyle='#f0f0f8';
  cx.beginPath(); cx.moveTo(-8,-102); cx.lineTo(0,-88); cx.lineTo(8,-102); cx.fill();
  cx.fillRect(-5,-88,10,32);
  // red tie
  cx.fillStyle='#aa1122';
  cx.beginPath(); cx.moveTo(-4,-90); cx.lineTo(4,-90); cx.lineTo(3,-65); cx.lineTo(0,-60); cx.lineTo(-3,-65); cx.closePath(); cx.fill();
  // lapels
  cx.fillStyle='#2a2a3a';
  cx.beginPath(); cx.moveTo(-8,-102); cx.lineTo(-24,-90); cx.lineTo(-14,-80); cx.lineTo(0,-88); cx.closePath(); cx.fill();
  cx.beginPath(); cx.moveTo(8,-102); cx.lineTo(24,-90); cx.lineTo(14,-80); cx.lineTo(0,-88); cx.closePath(); cx.fill();
  // arms (pointing/dramatic)
  cx.fillStyle='#1e1e2e';
  cx.save(); cx.translate(-40,-100); cx.rotate(-.25); cx.fillRect(0,0,16,46); cx.restore();
  cx.save(); cx.translate(26,-100); cx.rotate(.35); cx.fillRect(0,0,16,46); cx.restore();
  cx.fillStyle='#f0f0f8';
  cx.save(); cx.translate(-40,-58); cx.rotate(-.25); cx.fillRect(0,0,16,8); cx.restore();
  cx.save(); cx.translate(26,-58); cx.rotate(.35); cx.fillRect(0,0,16,8); cx.restore();
  cx.fillStyle=SK;
  cx.save(); cx.translate(-40,-52); cx.rotate(-.25); cx.fillRect(0,0,16,14); cx.restore();
  cx.save(); cx.translate(26,-52); cx.rotate(.35); cx.fillRect(0,0,16,14); cx.restore();
  // neck
  cx.fillStyle=SK; cx.fillRect(-7,-108,14,10);
  // BIG HEAD
  const hR=36,hy=-108-hR;
  cx.fillStyle=SK; cx.beginPath(); cx.arc(0,hy,hR,0,Math.PI*2); cx.fill();
  cx.fillStyle=HR; cx.beginPath(); cx.arc(0,hy,hR+1,0,Math.PI*2); cx.fill();
  cx.fillStyle=SK; cx.beginPath(); cx.arc(0,hy,hR,Math.PI*.08,Math.PI*.92,false); cx.fill();
  // hair texture
  cx.fillStyle='#2a1408';
  cx.beginPath(); cx.ellipse(-hR*.2,hy-hR*.85,hR*.22,hR*.1,-.2,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(hR*.15,hy-hR*.88,hR*.2,hR*.09,.2,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(-hR*.55,hy-hR*.72,hR*.18,hR*.08,-.3,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(hR*.5,hy-hR*.7,hR*.18,hR*.08,.3,0,Math.PI*2); cx.fill();
  cx.fillStyle=HR;
  cx.beginPath(); cx.ellipse(-hR*.9,hy+hR*.1,hR*.2,hR*.5,.05,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(hR*.9,hy+hR*.1,hR*.2,hR*.5,-.05,0,Math.PI*2); cx.fill();
  // eyes
  const ex1=-hR*.3,ex2=hR*.3,ey=hy+hR*.1;
  cx.fillStyle='#f0ebe0';
  cx.beginPath(); cx.ellipse(ex1,ey,hR*.2,hR*.13,0,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(ex2,ey,hR*.2,hR*.13,0,0,Math.PI*2); cx.fill();
  cx.fillStyle='#2e1206';
  cx.beginPath(); cx.arc(ex1,ey,hR*.12,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.arc(ex2,ey,hR*.12,0,Math.PI*2); cx.fill();
  cx.fillStyle='rgba(255,255,255,.85)';
  cx.beginPath(); cx.arc(ex1+hR*.05,ey-hR*.04,hR*.04,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.arc(ex2+hR*.05,ey-hR*.04,hR*.04,0,Math.PI*2); cx.fill();
  // eyebrows
  cx.fillStyle='#120806';
  cx.beginPath(); cx.ellipse(ex1,ey-hR*.23,hR*.22,hR*.09,-.1,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(ex2,ey-hR*.23,hR*.22,hR*.09,.1,0,Math.PI*2); cx.fill();
  // big smile
  const my=hy+hR*.54;
  cx.fillStyle='#3a0808'; cx.beginPath(); cx.ellipse(0,my,hR*.38,hR*.2,0,0,Math.PI); cx.fill();
  cx.fillStyle='#f2f0e8'; cx.beginPath(); cx.ellipse(0,my-hR*.02,hR*.33,hR*.13,0,0,Math.PI); cx.fill();
  // FULL BEARD
  cx.fillStyle='rgba(18,8,2,.78)';
  cx.beginPath(); cx.ellipse(0,hy+hR*.62,hR*.72,hR*.42,0,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(0,hy+hR*.82,hR*.35,hR*.25,0,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(-hR*.45,hy+hR*.42,hR*.22,hR*.35,.2,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(hR*.45,hy+hR*.42,hR*.22,hR*.35,-.2,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.ellipse(0,my-hR*.18,hR*.28,hR*.1,0,0,Math.PI*2); cx.fill();
  // teeth re-show
  cx.fillStyle='rgba(250,240,220,.85)'; cx.beginPath(); cx.ellipse(0,my-hR*.04,hR*.3,hR*.12,0,0,Math.PI); cx.fill();
  // coupons around Amir
  [[-55,-140,.4],[-70,-100,-.3],[60,-130,.5],[72,-90,-.4]].forEach(([dx,dy,rot])=>{
    cx.save(); cx.translate(dx,dy); cx.rotate(rot);
    cx.fillStyle='#22aa44'; cx.strokeStyle='#116622'; cx.lineWidth=1.5;
    cx.beginPath(); cx.roundRect?cx.roundRect(-13,-8,26,16,3):cx.rect(-13,-8,26,16); cx.fill(); cx.stroke();
    cx.fillStyle='#fff'; cx.font='bold 8px Arial'; cx.textAlign='center';
    cx.fillText('50%',0,4);
    cx.fillStyle='#ffee00'; cx.font='bold 6px Arial'; cx.fillText('₪ קופון',0,-2);
    cx.restore();
  });
  cx.restore();
}

// ── ENEMY SOLDIER (small) ─────────────────────────────────────
function drawEnemy(ox,oy,s=1){
  cx.save(); cx.translate(ox,oy); cx.scale(s,s);
  const BC='#354025',DB='#28341a',SK='#b07248',HC='#1a2810',BT='#1a1a10';

  cx.fillStyle=DB; cx.fillRect(-9,-28,9,14); cx.fillRect(2,-28,9,14);
  cx.fillStyle=BC; cx.fillRect(-13,-50,26,25);

  cx.fillStyle=SK; cx.fillRect(-21,-30,9,9); cx.fillRect(13,-30,9,9);
  cx.fillStyle=SK; cx.beginPath(); cx.arc(0,-38,14,0,Math.PI*2); cx.fill();
  cx.fillStyle='#cc2200';
  cx.beginPath(); cx.arc(-5,-38,2.5,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.arc(5,-38,2.5,0,Math.PI*2); cx.fill();
  cx.strokeStyle='#661100'; cx.lineWidth=2;
  cx.beginPath(); cx.arc(0,-31,5,Math.PI+.3,Math.PI*2-.3); cx.stroke();

  cx.save(); cx.translate(-7,-46); cx.rotate(.35); cx.fillRect(0,0,14,2.5); cx.restore();
  cx.save(); cx.translate(7,-46); cx.rotate(-.35); cx.fillRect(-12,0,14,2.5); cx.restore();
  cx.fillStyle=HC;
  cx.beginPath(); cx.arc(0,-38,17,Math.PI,Math.PI*2); cx.fill();
  cx.fillRect(-18,-38,36,8);

}

// ── SPEECH BUBBLE ─────────────────────────────────────────────
function speechBbl(bx,by,text,maxW=180){
  const pad=9,lH=16,fs=12;
  cx.font=`bold ${fs}px Arial`;
  const words=text.split(' '),lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;cx.measureText(t).width>maxW-pad*2?(lines.push(cur),cur=w):cur=t;}
  if(cur) lines.push(cur);
  const bw=Math.min(maxW,Math.max(...lines.map(l=>cx.measureText(l).width))+pad*2+6);
  const bh=lines.length*lH+pad*2;
  let sx=bx-bw/2,sy=by-bh-20;
  sx=Math.max(24,Math.min(W-bw-24,sx)); sy=Math.max(24,sy);
  cx.fillStyle='rgba(0,0,0,.2)'; cx.beginPath(); if(cx.roundRect)cx.roundRect(sx+3,sy+3,bw,bh,7); else cx.rect(sx+3,sy+3,bw,bh); cx.fill();
  cx.fillStyle='rgba(255,255,242,.97)'; cx.strokeStyle='#2244aa'; cx.lineWidth=2;
  cx.beginPath(); if(cx.roundRect)cx.roundRect(sx,sy,bw,bh,7); else cx.rect(sx,sy,bw,bh); cx.fill(); cx.stroke();
  cx.fillStyle='rgba(255,255,242,.97)';
  cx.beginPath(); cx.moveTo(bx-7,sy+bh); cx.lineTo(bx+7,sy+bh); cx.lineTo(bx,sy+bh+16); cx.closePath(); cx.fill();
  cx.strokeStyle='#2244aa'; cx.lineWidth=2;
  cx.beginPath(); cx.moveTo(bx-7,sy+bh); cx.lineTo(bx,sy+bh+16); cx.lineTo(bx+7,sy+bh); cx.stroke();
  cx.fillStyle='#111133'; cx.font=`bold ${fs}px Arial`; cx.textAlign='center'; cx.direction='rtl';
  lines.forEach((l,i)=>cx.fillText(l,sx+bw/2,sy+pad+fs+i*lH));
  cx.direction='ltr'; cx.textAlign='left';
}

// ── FLOATING BUBBLE ────────────────────────────────────────────

  cx.save();

  cx.beginPath(); cx.arc(x,y,r,0,Math.PI*2); cx.fill(); cx.stroke();
  cx.strokeStyle='rgba(150,255,200,.4)'; cx.lineWidth=1;
  cx.beginPath(); cx.arc(x-r*.28,y-r*.28,r*.44,0,Math.PI*2); cx.stroke();
  cx.fillStyle='rgba(255,255,255,.55)';
  cx.beginPath(); cx.ellipse(x-r*.25,y-r*.3,r*.15,r*.09,-.5,0,Math.PI*2); cx.fill();
  cx.fillStyle='#00dd66'; cx.font=`bold ${Math.max(9,r*.45)}px Arial`; cx.textAlign='center'; cx.direction='rtl';
  cx.fillText('לא',x,y-r*.1); cx.fillText('לזעת!',x,y+r*.38);
  cx.direction='ltr'; cx.restore();
}
